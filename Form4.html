<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Biodata (Perbaikan)</title>
    <style>
        label.t { display: inline-block; min-width: 120px; }
    </style>
</head>
<body>
<form action="Form4.html" method="POST">
    <fieldset>
        <legend><h1>Formulir Peserta</h1></legend>

        <p>
            <label class="t" for="nama">Nama :</label>
            <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>
        </p>
        <p>
            <label class="t" for="username">Username :</label>
            <input type="text" id="username" name="username" placeholder="Masukkan username"
                   required minlength="4" pattern="[A-Za-z0-9_]+" title="Hanya huruf, angka, dan garis bawah">
        </p>
        <p>
            <!-- PERBAIKAN 1: type=password + minimal 8 karakter -->
            <label class="t" for="password">Password :</label>
            <input type="password" id="password" name="password" placeholder="Masukkan password"
                   required minlength="8" autocomplete="new-password">
        </p>
        <p>
            Jenis Kelamin :
            <input type="radio" id="lk" name="jenkel" value="laki-laki" required><label for="lk">Laki-laki</label>
            <input type="radio" id="pr" name="jenkel" value="perempuan"><label for="pr">Perempuan</label>
        </p>
        <p>
            <label class="t" for="tanggal">Tanggal Lahir :</label>
            <input type="date" id="tanggal" name="tanggal" max="2026-11-10" required>
        </p>
        <p>
            <label class="t" for="agama">Agama :</label>
            <select id="agama" name="agama" required>
                <option value="" disabled selected>-- Pilih agama --</option>
                <option value="budha">Buddha</option>
                <option value="hindu">Hindu</option>
                <option value="islam">Islam</option>
                <option value="katolik">Kristen Katolik</option>
                <option value="protestan">Kristen Protestan</option>
                <option value="konghucu">Konghucu</option>
            </select>
        </p>
        <p>
            <label class="t" for="email">Email :</label>
            <input type="email" id="email" name="email" placeholder="nama@contoh.com" required>
        </p>
        <p>
            Pilih Course :
            <!-- PERBAIKAN: name tanpa spasi, value jelas, label sesuai (Mobile Lintas Platform) -->
            <input type="checkbox" id="c1" name="course" value="web-native"><label for="c1">Web Native</label>
            <input type="checkbox" id="c2" name="course" value="web-framework"><label for="c2">Web Framework</label>
            <input type="checkbox" id="c3" name="course" value="mobile-native"><label for="c3">Mobile Native</label>
            <input type="checkbox" id="c4" name="course" value="mobile-lintas-platform"><label for="c4">Mobile Lintas Platform</label>
        </p>
        <p>
            <!-- PERBAIKAN: tidak ada <p> bersarang; label terhubung ke textarea -->
            <label for="alamat">Alamat :</label><br>
            <textarea id="alamat" name="alamat" cols="50" rows="6" required></textarea>
        </p>
        <p>
            <input type="submit" name="submit" value="Daftar">
        </p>
    </fieldset>
</form>
</body>
</html>
