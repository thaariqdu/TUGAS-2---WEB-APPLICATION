<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mengenal Form Nusantech Academy (Perbaikan)</title>
    <style>
        #pesan { font-size: 14px; color: red; min-height: 1.2em; }
    </style>
</head>
<body>
    <form action="" id="loginForm" novalidate>
        <h1>Login</h1>
        <p>
            <label for="username">Username</label><br>
            <input type="text" id="username" class="form-control" placeholder="Enter your Username..." autocomplete="username">
        </p>
        <p>
            <label for="password">Password</label><br>
            <!-- PERBAIKAN: type=password agar disamarkan -->
            <input type="password" id="password" class="form-control" placeholder="Enter your Password..." autocomplete="current-password">
        </p>
        <p id="pesan" role="alert"></p>
        <button type="submit">Submit</button>
    </form>

    <script>
        const loginForm = document.getElementById("loginForm");
        loginForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const username = document.getElementById("username");
            const password = document.getElementById("password");
            const pesan = document.getElementById("pesan");

            // PERBAIKAN: trim() agar input berisi spasi saja dianggap kosong
            if (username.value.trim() === "" || password.value.trim() === "") {
                pesan.textContent = "Ensure you input a value in both fields!";
                alert("Ensure you input a value in both fields!");
                (username.value.trim() === "" ? username : password).focus();
            } else {
                pesan.textContent = "";
                alert("This form has been successfully submitted!");
                // PERBAIKAN: password TIDAK dicetak ke console
                console.log(`Form login diterima untuk username: ${username.value.trim()}`);
                // Di aplikasi nyata: kirim lewat fetch() POST (HTTPS) ke server untuk autentikasi
                username.value = "";
                password.value = "";
            }
        });
    </script>
</body>
</html>
